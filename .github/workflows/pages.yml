name: Deploy HomeFinder

# Pages only accepts / or /docs as a branch source, and the site lives in web/,
# so publish through Actions instead: upload the built web/ directory as the
# Pages artifact. Nothing is compiled here — web/index.html is a self-contained
# file the local pipeline writes, so a deploy is just a copy.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
